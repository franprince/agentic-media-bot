name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --omit=optional

      - name: Install proxy-ui dependencies
        run: bun install --frozen-lockfile
        working-directory: proxy-ui

      - name: Verify src/bot.ts bundles cleanly
        run: bun run check:bot-parse

      - name: Run test suite
        run: bun test
